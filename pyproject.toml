[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-moneyline-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "pytz>=2024.1",
    "MLB-StatsAPI>=1.9,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
